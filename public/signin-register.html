<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perimeter Zero · Sign in & Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;--bg:#04070d;--surface:rgba(9,17,29,.8);--surface-2:rgba(18,32,52,.72);
  --ink:#e8fff6;--muted:#86a2b6;--line:rgba(60,230,200,.16);--brand:#22d3ee;--brand-soft:rgba(34,211,238,.13);
  --focus:#67e8f9;--pass:#3dffa0;--pass-soft:rgba(61,255,160,.11);--fail:#ff4d6d;--fail-soft:rgba(255,77,109,.13);
  --shadow:0 0 0 1px rgba(34,211,238,.04),0 18px 44px -22px rgba(0,0,0,.9);
  --font-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.5;pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.72) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px)}
.page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) 26px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;max-width:1180px;width:100%;margin:0 auto}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.brand svg{color:var(--brand);filter:drop-shadow(0 0 8px rgba(34,211,238,.75))}
.brand small{font-family:var(--font-mono);font-weight:600;font-size:.6rem;letter-spacing:.16em;color:var(--brand);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.topnav{display:flex;align-items:center;gap:16px;font-family:var(--font-mono);font-size:.72rem}
.topnav a{color:var(--muted);text-decoration:none}
.topnav a:hover{color:var(--brand)}
.topnav .dot{display:inline-flex;align-items:center;gap:7px;color:var(--muted)}
.topnav .dot i{width:6px;height:6px;border-radius:50%;background:var(--pass);box-shadow:0 0 8px var(--pass);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.auth-wrap{flex:1;width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,452px);gap:clamp(26px,5vw,76px);align-items:center;padding:clamp(26px,5vh,64px) 0}
@media (max-width:960px){.auth-wrap{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:34px}.pitch .bullets{display:none}}
.pitch{max-width:580px;min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--pass);margin:0 0 14px}
.pitch h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.9rem,4.2vw,3.15rem);line-height:1.06;letter-spacing:-.022em;background:linear-gradient(90deg,#eafff6,#67e8f9 55%,#3dffa0);-webkit-background-clip:text;background-clip:text;color:transparent}
.pitch .lead{margin:16px 0 0;color:var(--muted);max-width:56ch;font-size:1rem}
.pitch .bullets{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:15px}
.pitch .bullets li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:.92rem}
.pitch .bullets .ic{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);border:1px solid rgba(34,211,238,.22)}
.pitch .bullets .ic svg{width:14px;height:14px}
.pitch .bullets b{display:block;font-weight:700;font-size:.94rem}
.pitch .bullets small{display:block;color:var(--muted);font-size:.86rem;line-height:1.45;margin-top:2px}
.trust{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.trust span{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:.7rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:rgba(9,17,29,.55)}
.trust i{width:6px;height:6px;border-radius:50%;background:var(--pass);box-shadow:0 0 8px var(--pass)}
.auth-card{position:relative;overflow:hidden;min-width:0;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,3.1vw,28px);background:radial-gradient(520px 260px at 100% 0%,rgba(34,211,238,.16),transparent 65%),linear-gradient(135deg,rgba(6,19,31,.93),rgba(10,44,60,.86));box-shadow:0 0 50px -18px rgba(34,211,238,.45),var(--shadow)}
.auth-card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--brand),var(--pass),transparent)}
.card-kicker{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card-kicker i{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand)}
.tabs{display:flex;gap:4px;padding:4px;margin-bottom:18px;border:1px solid var(--line);border-radius:13px;background:rgba(4,10,18,.62)}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:.88rem;padding:9px 8px;border-radius:9px;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--brand-soft);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(34,211,238,.32)}
.role-label{font-family:var(--font-mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.roles{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.roles input{position:absolute;opacity:0;pointer-events:none}
.roles label{display:flex;flex-direction:column;gap:5px;cursor:pointer;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;background:rgba(4,10,18,.35);transition:border-color .15s,background .15s}
.roles label:hover{border-color:rgba(34,211,238,.45)}
.roles label .ri{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.roles label .ri svg{width:17px;height:17px}
.roles label b{font-size:.92rem;font-weight:800}
.roles label small{color:var(--muted);font-size:.74rem}
.roles input:checked+label{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
.roles input:checked+label .ri{background:linear-gradient(135deg,#22d3ee,#3dffa0);color:#02131a}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.field > label{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field .wrap{position:relative;display:flex;min-width:0}
.field input{width:100%;min-width:0;font:inherit;color:var(--ink);background:rgba(4,10,18,.58);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px}
.field input::placeholder{color:rgba(134,162,182,.65)}
.field input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(34,211,238,.16)}
.field.has-toggle input{padding-right:46px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.eye:hover{color:var(--ink);background:var(--surface-2)}
.eye svg{width:17px;height:17px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:.83rem;color:var(--muted);cursor:pointer;user-select:none;line-height:1.45}
.check input{appearance:none;flex:none;position:relative;cursor:pointer;width:18px;height:18px;margin-top:1px;border:1.5px solid var(--line);border-radius:5px;background:rgba(4,10,18,.6)}
.check input:checked{background:linear-gradient(135deg,#22d3ee,#3dffa0);border-color:transparent}
.check input:checked::after{content:"";position:absolute;left:5px;top:1.5px;width:5px;height:10px;border:solid #02131a;border-width:0 2px 2px 0;transform:rotate(45deg)}
.check a,.lnk{color:var(--brand);text-decoration:none;font-weight:700}
.submit{width:100%;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-weight:800;font-size:.95rem;color:#02131a;background:linear-gradient(90deg,#22d3ee,#3dffa0)}
.submit svg{width:17px;height:17px}
.submit:hover{filter:brightness(1.08);box-shadow:0 0 26px -4px rgba(34,211,238,.75)}
.submit:disabled{filter:grayscale(.55) brightness(.78);cursor:not-allowed}
.legal{margin:12px 0 0;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:.67rem}
.msg{display:none;border-radius:10px;padding:9px 12px;font-size:.83rem;font-weight:600;margin-bottom:14px}
.msg.show{display:block}
.msg.err{background:var(--fail-soft);border:1px solid rgba(255,77,109,.5);color:#ffb3be}
.msg.ok{background:var(--pass-soft);border:1px solid rgba(61,255,160,.45);color:#8effc4}
.card-foot{margin:18px 0 0;text-align:center;font-size:.81rem;color:var(--muted)}
@media (max-width:680px){.roles{grid-template-columns:1fr}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="page">
  <header class="topbar">
    <a class="brand" href="#">
      <svg width="20" height="22" viewBox="0 0 16 18" fill="none"><path d="M8 1 2 3.6v5.1c0 3.5 2.5 6.4 6 7.8 3.5-1.4 6-4.3 6-7.8V3.6L8 1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m5.4 8.8 2 2 3.4-3.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Perimeter Zero<small>Auth</small></span>
    </a>
    <nav class="topnav"><span class="dot"><i></i>secure channel</span></nav>
  </header>
  <div class="auth-wrap">
    <section class="pitch">
      <p class="eyebrow" id="pitch-eyebrow">// for companies</p>
      <h1 id="pitch-h">Ship to production without shipping your customers' data.</h1>
      <p class="lead" id="pitch-lead"></p>
      <ul class="bullets" id="pitch-bullets"></ul>
      <div class="trust">
        <span><i></i>ownership-verified assets</span>
        <span><i></i>escrow-funded engagements</span>
      </div>
    </section>
    <section class="auth-card" id="card">
      <p class="card-kicker"><i></i>authenticate to continue</p>
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" type="button" data-mode="signin" aria-selected="true">Sign in</button>
        <button role="tab" type="button" data-mode="signup" aria-selected="false">Create account</button>
      </div>
      <p class="role-label">Account type</p>
      <div class="roles" role="radiogroup" id="roles"></div>
      <div class="msg" id="msg" role="status"></div>
      <form id="form" novalidate>
        <div id="fields"></div>
        <button class="submit" type="submit" id="submit"></button>
        <p class="legal" id="legal"></p>
      </form>
      <p class="card-foot" id="foot"></p>
    </section>
  </div>
</div>
<script>
(function(){
  "use strict";
  var ICON={
    building:'<svg viewBox="0 0 20 20" fill="none"><path d="M3 17V4.6A1.6 1.6 0 0 1 4.6 3h5.8A1.6 1.6 0 0 1 12 4.6V17M12 8.2h3.4A1.6 1.6 0 0 1 17 9.8V17M1.5 17h17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5.4 6.4h4M5.4 9.4h4M5.4 12.4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
    terminal:'<svg viewBox="0 0 20 20" fill="none"><rect x="2" y="3.6" width="16" height="12.8" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="m6 8.2 2.4 1.9L6 12M10.6 12h3.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    check:'<svg viewBox="0 0 16 16" fill="none"><path d="m3.2 8.4 3.1 3.1 6.5-6.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    eye:'<svg viewBox="0 0 20 20" fill="none"><path d="M1.9 10S4.9 4.6 10 4.6 18.1 10 18.1 10 15.1 15.4 10 15.4 1.9 10 1.9 10Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/></svg>',
    eyeOff:'<svg viewBox="0 0 20 20" fill="none"><path d="M1.9 10S4.9 4.6 10 4.6 18.1 10 18.1 10 15.1 15.4 10 15.4 1.9 10 1.9 10Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="m3 17 14-14" stroke="currentColor" stroke-width="1.7"/></svg>',
    arrow:'<svg viewBox="0 0 20 20" fill="none"><path d="M3.5 10h13m0 0-5-5m5 5-5 5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>'
  };
  var state={mode:"signin",role:"company"};
  var PITCH={
    company:{eyebrow:"// for companies",h:"Ship to production without shipping your customers' data.",lead:"Scope a test, fund escrow, and pay only for findings that survive verification.",bullets:[["Fund escrow, not guesswork","You approve scope and price. Money releases when a finding is verified."],["Reports you can act on","Severity is scored against a policy you agree to before testing starts."],["Priced for teams without a security department","Fixed-price engagements scoped to your stack."]]},
    tester:{eyebrow:"// for testers",h:"Turn verified findings into a track record you can prove.",lead:"Pick scoped engagements from small businesses, submit evidence that replays, and get paid from escrow.",bullets:[["Paid from escrow, not promises","The money is held before you start."],["Reputation built on evidence","Your score comes from findings that replay in the sandbox."],["Work in a team","Bring collaborators under one accountable lead."]]}
  };
  var tabsEl=document.getElementById("tabs"),rolesEl=document.getElementById("roles"),fieldsEl=document.getElementById("fields"),
      formEl=document.getElementById("form"),submitEl=document.getElementById("submit"),msgEl=document.getElementById("msg"),
      footEl=document.getElementById("foot"),legalEl=document.getElementById("legal");

  function rolesHTML(){
    return '<input type="radio" name="role" id="role-company" value="company"'+(state.role==="company"?" checked":"")+'>'+
      '<label for="role-company"><span class="ri">'+ICON.building+'</span><b>Company</b><small>I need my product tested</small></label>'+
      '<input type="radio" name="role" id="role-tester" value="tester"'+(state.role==="tester"?" checked":"")+'>'+
      '<label for="role-tester"><span class="ri">'+ICON.terminal+'</span><b>Tester</b><small>I test products for a living</small></label>';
  }
  function passwordField(ph){
    return '<div class="field has-toggle"><label for="password">Password</label><div class="wrap">'+
      '<input type="password" id="password" name="password" placeholder="'+ph+'" required>'+
      '<button type="button" class="eye" data-act="togglepw" aria-label="Show password">'+ICON.eye+'</button></div></div>';
  }
  function fieldsHTML(){
    if(state.mode==="signin"){
      return '<div class="field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@company.com" required></div>'+
        passwordField("Enter your password");
    }
    if(state.role==="company"){
      return '<div class="field"><label for="org">Company name</label><input type="text" id="org" name="org" placeholder="Acme Commerce" required></div>'+
        '<div class="field"><label for="email">Work email</label><input type="email" id="email" name="email" placeholder="you@acme.com" required></div>'+
        passwordField("At least 6 characters")+
        '<label class="check" style="margin-bottom:14px"><input type="checkbox" id="terms" name="terms" required><span>I agree to the Terms.</span></label>';
    }
    return '<div class="field"><label for="name">Full name</label><input type="text" id="name" name="name" placeholder="Your legal name" required></div>'+
      '<div class="field"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" required></div>'+
      passwordField("At least 6 characters")+
      '<label class="check" style="margin-bottom:14px"><input type="checkbox" id="terms" name="terms" required><span>I agree to the Tester Agreement.</span></label>';
  }
  function submitLabel(){return state.mode==="signin"?"Sign in":(state.role==="company"?"Create company account":"Create tester account")}
  function legalText(){return state.mode==="signin"?"Authorized testing only.":(state.role==="company"?"You must own every asset you add.":"False findings end the account.")}
  function footHTML(){return state.mode==="signin"?'New here? <a class="lnk" href="#" data-act="switch" data-mode="signup">Create an account</a>':'Already registered? <a class="lnk" href="#" data-act="switch" data-mode="signin">Sign in</a>'}
  function renderPitch(){
    var p=PITCH[state.role];
    document.getElementById("pitch-eyebrow").textContent=p.eyebrow;
    document.getElementById("pitch-h").textContent=p.h;
    document.getElementById("pitch-lead").textContent=p.lead;
    document.getElementById("pitch-bullets").innerHTML=p.bullets.map(function(b){
      return '<li><span class="ic">'+ICON.check+'</span><span><b>'+b[0]+'</b><small>'+b[1]+'</small></span></li>';
    }).join("");
  }
  function renderCard(){
    var keep={};
    fieldsEl.querySelectorAll("input").forEach(function(el){if(el.id)keep[el.id]=el.type==="checkbox"?el.checked:el.value});
    rolesEl.innerHTML=rolesHTML();
    fieldsEl.innerHTML=fieldsHTML();
    Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el){if(el.type==="checkbox")el.checked=keep[id];else el.value=keep[id]}});
    Array.prototype.forEach.call(tabsEl.querySelectorAll("[role=tab]"),function(b){b.setAttribute("aria-selected",String(b.dataset.mode===state.mode))});
    submitEl.innerHTML=submitLabel()+ICON.arrow;
    legalEl.textContent=legalText();
    footEl.innerHTML=footHTML();
  }
  function showMsg(text,kind){msgEl.textContent=text;msgEl.className="msg show "+(kind||"err")}
  function hideMsg(){msgEl.className="msg";msgEl.textContent=""}

  tabsEl.addEventListener("click",function(e){
    var b=e.target.closest("[role=tab]");if(!b||b.dataset.mode===state.mode)return;
    state.mode=b.dataset.mode;hideMsg();renderCard();
  });
  rolesEl.addEventListener("change",function(e){
    if(e.target.name!=="role")return;
    state.role=e.target.value;hideMsg();renderCard();renderPitch();
  });
  document.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");if(!b)return;
    if(b.dataset.act==="togglepw"){
      e.preventDefault();var input=b.parentElement.querySelector("input");
      var show=input.type==="password";input.type=show?"text":"password";
      b.innerHTML=show?ICON.eyeOff:ICON.eye;input.focus();return;
    }
    if(b.dataset.act==="switch"){e.preventDefault();state.mode=b.dataset.mode;hideMsg();renderCard();return}
  });

  formEl.addEventListener("submit",async function(e){
    e.preventDefault();hideMsg();
    var data=Object.fromEntries(new FormData(formEl).entries());
    if(!data.email||!data.password)return showMsg("Fill all fields","err");
    if(state.mode==="signup"&&!data.terms)return showMsg("Accept terms","err");

    submitEl.disabled=true;submitEl.textContent="Working…";
    try{
      var url=state.mode==="signin"?"/api/auth/login":"/api/auth/register";
      var body;
      if(state.mode==="signin"){
        body={email:data.email,password:data.password};
      }else{
        body={
          role:state.role,
          name:state.role==="company"?data.org:data.name,
          email:data.email,
          password:data.password
        };
      }
      var res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      var json=await res.json();
      if(!res.ok)throw new Error(json.error||"Authentication failed");

      if(state.mode==="signin"){
        localStorage.setItem("pz_token",json.token);
        localStorage.setItem("pz_user",JSON.stringify(json.user));
        localStorage.setItem("pz_session",JSON.stringify(json.user));
        showMsg("Signed in. Redirecting…","ok");
        var dest=json.user.role==="company"?"admin-dashboard.html":"tester-dashboard.html";
        setTimeout(function(){window.location.href=dest},600);
      }else{
        showMsg("Account created! Please sign in.","ok");
        state.mode="signin";renderCard();
        submitEl.disabled=false;submitEl.innerHTML=submitLabel()+ICON.arrow;
      }
    }catch(err){
      showMsg(err.message,"err");
      submitEl.disabled=false;submitEl.innerHTML=submitLabel()+ICON.arrow;
    }
  });

  renderPitch();renderCard();
})();
</script>
</body>
</html>
